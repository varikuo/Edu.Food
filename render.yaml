# Деплой на Render: один веб-сервис отдаёт и API, и собранный фронт.
# Секрет подписи токенов Render генерирует сам (generateValue).
#
# Тариф бесплатный, поэтому постоянного диска нет: база лежит во временной
# папке и пересоздаётся сидом при каждом деплое и после простоя. Для демо это
# безопасно — логины и пароли учеников детерминированы от ФИО, поэтому после
# пересоздания базы они те же (файл выдаётся заново в /tmp/edufood/logins.csv).
# С постоянными данными: plan: starter + диск на /var/data.
services:
  - type: web
    name: edufood
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /tmp/edufood
      # node:sqlite появился в Node 24 — фиксируем версию, иначе Render возьмёт старую
      - key: NIXPACKS_NODE_VERSION
        value: "24"
      # Часовой пояс столовой: дедлайн выбора и «сегодня» считаются от него
      - key: TZ_OFFSET_MIN
        value: "540"
      - key: CHOICE_DEADLINE
        value: "08:15"
      - key: CHOICE_ENFORCE_DEADLINE
        value: "true"
